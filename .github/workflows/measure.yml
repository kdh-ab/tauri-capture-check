# Tauri contentProtected(창을 캡처에서 제외)가 Windows의 캡처·녹화 경로에서 실제로 빠지는지 잰다.
# 결과는 실행 요약(Summary)과 아티팩트(캡처 사진, results.json, 테스트 앱 exe)로 남는다.
name: measure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm은 Windows 11(클라이언트) 환경이다. 측정 스크립트는 x64 Python(에뮬레이션)으로 돌린다.
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build test app
        working-directory: app
        run: cargo build --release --locked

      - name: Ensure WebView2 runtime
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client"
          )
          if ($keys | Where-Object { Test-Path $_ }) { 'WebView2 runtime present'; exit 0 }
          'Installing WebView2 runtime'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
          Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install capture libraries
        run: python -m pip install --disable-pip-version-check numpy pillow mss dxcam windows-capture

      - name: Run app and measure
        run: |
          $app = Start-Process -FilePath 'app/target/release/capture-poc.exe' -PassThru
          try {
            python capture_check.py out
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path out/summary.md) { Get-Content out/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY }
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-${{ matrix.os }}
          path: |
            out/
            app/target/release/capture-poc.exe
          if-no-files-found: warn
