<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>CONTROL</title>
<style>html,body{margin:0;height:100%;background:#1f9d3a;color:#fff;font:700 32px/1.3 "Segoe UI",-apple-system,sans-serif;display:grid;place-items:center;text-align:center}</style>
</head><body><div>CONTROL<br><span style="font-size:18px">contentProtected: false<br>비교용 일반 창</span><br><span id="clock" style="font-size:18px"></span></div>

</body></html>
